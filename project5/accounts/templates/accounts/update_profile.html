{% extends './base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-5">

    <h1 class="mb-4 text-primary">Edit Profile</h1>

    
    <div class="border rounded p-4 shadow-sm mb-4">
        <h4 class="mb-3">Account Information</h4>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ user_form|crispy }}
            {{ profile_form|crispy }}
            <button type="submit" name="save_all" class="btn btn-primary">
                Save Changes
            </button>
        </form>
    </div>


    
    <div class="border rounded p-4 shadow-sm mb-4">
        <h4 class="mb-3">Change Password</h4>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            {{ password_form|crispy }}
            <button type="submit" name="change_password" class="btn btn-warning mt-3">
                Change Password
            </button>
        </form>
    </div>

</div>
{% endblock %}
