{% extends './base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container py-5">

    <h1 class="mb-4 text-primary">Sign Up</h1>

    <form method="POST" autocomplete="off" class="border rounded p-4 shadow-sm">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Sign Up</button>
            <br>
            <small class="text-secondary">
                Already have an account?
                <a href="{% url 'login' %}" class="link-primary text-decoration-none">Login</a>
            </small>
        </div>
    </form>

</div>
{% endblock %}
