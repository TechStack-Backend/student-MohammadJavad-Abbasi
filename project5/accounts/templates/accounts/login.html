{% extends './base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">

    <h1 class="mb-4 text-primary">Login</h1>

    <form method="POST" autocomplete="off" class="border rounded p-4 shadow-sm">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Login</button>
            <br>
            <small class="text-secondary">
                Don’t have an account?
                <a href="{% url 'signup' %}" class="link-primary text-decoration-none">Sign up</a>
            </small>
            <br>
            <small class="text-secondary">
                Forgot your password?
                <a href="{% url 'password_reset' %}" class="link-primary text-decoration-none">Reset Password</a>
            </small>
        </div>
    </form>

</div>
{% endblock %}
